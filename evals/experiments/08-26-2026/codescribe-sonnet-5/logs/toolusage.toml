args = "{\"path\": \"software/mcfm/src/BDK/M1bit1.cpp\", \"content\": \"#include <BDK.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <FArray.hpp>\\n#include <W1jet.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\n// Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\\n// Eq 7.1\\nstd::complex<double> M1bit1(int j1, int j2, int j3, int j4, int j5, int j6, FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n  auto zab2 = [&za, &zb](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n  auto zba2 = [&za, &zb](int i1, int i2, int i3, int i4) {\\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\\n  };\\n  auto zab = [&za, &zb](int i1, int i2, int i3) {\\n    return za(i1,i2)*zb(i2,i3);\\n  };\\n\\n  double delta12 = s(j1,j2) - s(j3,j4) - s(j5,j6);\\n  double delta56 = s(j5,j6) - s(j1,j2) - s(j3,j4);\\n  double Delta3 = std::pow(s(j1,j2),2) + std::pow(s(j3,j4),2) + std::pow(s(j5,j6),2)\\n      - 2*s(j1,j2)*s(j3,j4) - 2*s(j3,j4)*s(j5,j6) - 2*s(j5,j6)*s(j1,j2);\\n\\n  // @coverage-probe\\n  std::complex<double> M1bit1_res =\\n      +2.0/(zab2(j1,j3,j4,j2)*zab2(j3,j1,j2,j4)*Delta3)\\n      *(zb(j1,j3)/za(j5,j6)\\n        *(za(j2,j1)*zba2(j1,j3,j4,j5)\\n          -(zab2(j2,j3,j4,j1)*za(j1,j5)+zab2(j2,j3,j4,j2)*za(j2,j5)))\\n        *(za(j1,j5)*t(j1,j2,j4)+zab(j1,j2,j6)*za(j6,j5))\\n        -zb(j1,j6)*za(j2,j4)/(za(j3,j4)*zb(j5,j6))\\n        *((s(j1,j4)-s(j2,j3))\\n          *(zab(j1,j2,j6)*delta12-zab(j1,j5,j6)*delta56)\\n          +zab2(j1,j3,j4,j2)*(zab(j2,j1,j6)*delta12-zab(j2,j5,j6)*delta56))\\n        +2.0*zab(j2,j1,j3)*zab2(j5,j1,j2,j6)*(s(j1,j4)-s(j2,j3)));\\n\\n  return M1bit1_res;\\n}\\n\\nextern \\\"C\\\" {\\n  std::complex<double> M1bit1_wrapper(int j1, int j2, int j3, int j4, int j5, int j6, std::complex<double>* za_ptr, std::complex<double>* zb_ptr) {\\n    using namespace mxpart_mod;\\n\\n    FArray2D<std::complex<double>> za(za_ptr, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(zb_ptr, mxpart, mxpart);\\n\\n    return M1bit1(j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n}\\n\"}"
