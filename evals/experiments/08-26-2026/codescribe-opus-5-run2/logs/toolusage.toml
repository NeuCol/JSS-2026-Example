args = "{\"path\": \"software/mcfm/src/W2jet/LRcalc.cpp\", \"content\": \"#include <LRcalc.hpp>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\nvoid LRcalc(int k1, int k2, int k3, int k4, int k5, int k6,\\n            FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n            FArray1D<std::complex<double>>& A,\\n            FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n            FArray2D<std::complex<double>>& Xpm, FArray2D<std::complex<double>>& Xmm) {\\n  int l3 = 0, l4 = 0, l5 = 0, l6 = 0;\\n  double s12, s34, s56;\\n\\n  //---statement functions\\n  auto zab2 = [&za, &zb](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n  auto zba2 = [&za, &zb](int i1, int i2, int i3, int i4) {\\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\\n  };\\n  //---end statement functions\\n\\n  s12 = s(k1,k2);\\n  s34 = s(k3,k4);\\n  s56 = s(k5,k6);\\n\\n  for (int h3 = 1; h3 <= 2; h3++) {\\n    if (h3 == 1) {\\n      l3 = k3;\\n      l4 = k4;\\n    } else if (h3 == 2) {\\n      l3 = k4;\\n      l4 = k3;\\n    }\\n    for (int h5 = 1; h5 <= 2; h5++) {\\n      if (h5 == 1) {\\n        l5 = k5;\\n        l6 = k6;\\n      } else if (h5 == 2) {\\n        l5 = k6;\\n        l6 = k5;\\n      }\\n\\n      Xmp(h3,h5) = (A(2)*s12*za(l3,l5)*zb(l4,l6)*zab2(k1,k3,k4,k2)/zab2(k2,k3,k4,k1)\\n                    - (A(3)+A(4))*za(k1,l3)*za(k1,l5)*zb(k2,l4)*zb(k2,l6)\\n                    + A(5)*zab2(k1,k3,k4,k2)\\n                      * (za(l3,l5)*zb(k2,l4)*zb(l6,k2)/zb(k1,k2)\\n                         + za(k1,l3)*za(k1,l5)*zb(l4,l6)/za(k1,k2)))/s34/s56/s12;   // @coverage-probe\\n\\n      Xpp(h3,h5) = za(l3,l5)/(za(k1,k2)*s12*s34*s56)\\n                   * (+(A(3)+A(1))*s12*zb(k1,l6)*zb(l4,k2)\\n                      - (A(4)+A(1))*s12*zb(k2,l6)*zb(l4,k1)\\n                      + A(5)*(zb(k2,l4)*zb(k2,l6)*zab2(k2,k3,k4,k1)\\n                              - zb(k1,l4)*zb(k1,l6)*zab2(k1,k3,k4,k2)));\\n\\n      //--- these are obtained by c.c. of above\\n      Xpm(3-h3,3-h5) = (A(2)*s12*zb(l3,l5)*za(l4,l6)*zba2(k1,k3,k4,k2)/zba2(k2,k3,k4,k1)\\n                        - (A(3)+A(4))*zb(k1,l3)*zb(k1,l5)*za(k2,l4)*za(k2,l6)\\n                        + A(5)*zba2(k1,k3,k4,k2)\\n                          * (zb(l3,l5)*za(k2,l4)*za(l6,k2)/za(k1,k2)\\n                             + zb(k1,l3)*zb(k1,l5)*za(l4,l6)/zb(k1,k2)))/s34/s56/s12;\\n\\n      Xmm(3-h3,3-h5) = zb(l3,l5)/(zb(k1,k2)*s12*s34*s56)\\n                       * (+(A(3)+A(1))*s12*za(k1,l6)*za(l4,k2)\\n                          - (A(4)+A(1))*s12*za(k2,l6)*za(l4,k1)\\n                          + A(5)*(za(k2,l4)*za(k2,l6)*zba2(k2,k3,k4,k1)\\n                                  - za(k1,l4)*za(k1,l6)*zba2(k1,k3,k4,k2)));\\n    }\\n  }\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n  void LRcalc_wrapper(int k1, int k2, int k3, int k4, int k5, int k6,\\n                      std::complex<double>* fza, std::complex<double>* fzb,\\n                      std::complex<double>* fA,\\n                      std::complex<double>* fxpp, std::complex<double>* fxmp,\\n                      std::complex<double>* fxpm, std::complex<double>* fxmm) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    FArray1D<std::complex<double>> A(fA, 6);\\n    FArray2D<std::complex<double>> Xpp(fxpp, 2, 2);\\n    FArray2D<std::complex<double>> Xmp(fxmp, 2, 2);\\n    FArray2D<std::complex<double>> Xpm(fxpm, 2, 2);\\n    FArray2D<std::complex<double>> Xmm(fxmm, 2, 2);\\n    LRcalc(k1, k2, k3, k4, k5, k6, za, zb, A, Xpp, Xmp, Xpm, Xmm);\\n  }\\n}\\n\"}"
