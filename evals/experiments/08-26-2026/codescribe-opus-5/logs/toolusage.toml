f ((st[0] == 's') && (st[1] == 'l')) {\\n//---this is not a real tree amplitude but it is an auxiliary quantity.\\n    atree_value = -tree(j3, j1, j2, j4, j5, j6);\\n  }\\n\\n  return atree_value;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  std::complex<double> atree_wrapper(const char* st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                     std::complex<double>* za_ptr, std::complex<double>* zb_ptr) {\\n\\n    using namespace mxpart_mod;\\n\\n    FArray2D<std::complex<double>> za(za_ptr, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(zb_ptr, mxpart, mxpart);\\n\\n    return atree(st, j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n\\n}\\n\"}"
