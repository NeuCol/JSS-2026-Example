za(j3,j4)*za(j5,j6));   // @coverage-probe\\n  } else if (st == hqpgpqbmgm) {\\n    a6treeg_res =\\n      (((za(j3,j5)*zb(j1,j3)+za(j4,j5)*zb(j1,j4))*\\n        (-(za(j1,j3)*zb(j1,j6))-za(j2,j3)*zb(j2,j6)))/\\n       (s(j5,j6)*za(j1,j2)*za(j2,j3)*zb(j1,j4)*zb(j3,j4)) +\\n       (za(j3,j5)*zb(j1,j2)*(-(za(j1,j4)*zb(j1,j6))-za(j2,j4)*zb(j2,j6)))/\\n       (s(j5,j6)*za(j1,j2)*zb(j1,j4)*t(j1,j2,j4)) -\\n       (za(j3,j4)*zb(j1,j6)*(za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4)))/\\n       (s(j5,j6)*za(j2,j3)*zb(j3,j4)*t(j2,j3,j4)));\\n  } else if (st == hqpgpqbmgp) {\\n    a6treeg_res =\\n      (-za(j1,j3)*std::pow(za(j3,j5),2))/\\n      (za(j1,j2)*za(j1,j4)*za(j2,j3)*za(j3,j4)*za(j5,j6));\\n  } else if (st == hqpqbmgmgp) {\\n    a6treeg_res =\\n      (((-(za(j2,j5)*zb(j2,j4))-za(j3,j5)*zb(j3,j4))*\\n        (-(za(j1,j3)*zb(j1,j6))+za(j3,j4)*zb(j4,j6)))/\\n       (s(j3,j4)*s(j5,j6)*za(j1,j4)*zb(j2,j3)) -\\n       (za(j1,j3)*za(j2,j5)*zb(j1,j4)*\\n        (-(za(j1,j3)*zb(j1,j6))+za(j3,j4)*zb(j4,j6)))/\\n       (s(j3,j4)*s(j5,j6)*za(j1,j4)*t(j1,j3,j4)) -\\n       (za(j2,j3)*zb(j1,j6)*zb(j2,j4)*\\n        (-(za(j2,j5)*zb(j2,j4))-za(j3,j5)*zb(j3,j4)))/\\n       (s(j3,j4)*s(j5,j6)*zb(j2,j3)*t(j2,j3,j4)));\\n  } else if (st == hqpqbmgpgm) {\\n    a6treeg_res =\\n      -(-((za(j2,j4)*za(j2,j5)*zb(j1,j3)*zb(j1,j6))/\\n          (s(j3,j4)*s(j5,j6)*za(j2,j3)*zb(j1,j4))) +\\n        (za(j2,j5)*std::pow(zb(j1,j3),2)*(-(za(j1,j4)*zb(j1,j6))-za(j3,j4)*zb(j3,j6)))/\\n        (s(j3,j4)*s(j5,j6)*zb(j1,j4)*t(j1,j3,j4)) +\\n        (std::pow(za(j2,j4),2)*zb(j1,j6)*(-(za(j2,j5)*zb(j2,j3))+za(j4,j5)*zb(j3,j4)))/\\n        (s(j3,j4)*s(j5,j6)*za(j2,j3)*t(j2,j3,j4)));\\n  } else if (st == hqpqbmgpgp) {\\n    a6treeg_res =\\n      (-std::pow(za(j2,j5),2))/(za(j1,j4)*za(j2,j3)*za(j3,j4)*za(j5,j6));\\n  } else {\\n    std::cout << \\\" unimplemented st\\\" << st << std::endl;\\n    std::exit(0);\\n  }\\n\\n  return a6treeg_res;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  std::complex<double> a6treeg_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                       std::complex<double>* za_ptr, std::complex<double>* zb_ptr) {\\n\\n    FArray2D<std::complex<double>> za(za_ptr, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(zb_ptr, mxpart, mxpart);\\n\\n    return a6treeg(st, j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n\\n}\\n\"}"
