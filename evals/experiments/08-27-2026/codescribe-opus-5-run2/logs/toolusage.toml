args = "{\"path\": \"software/mcfm/src/BDK/fvs.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <fvs.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <heldefs_mod.hpp>\\n#include <Need.hpp>\\n#include <W1jet.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\nusing namespace heldefs_mod;\\n\\n//---This is the curly braces expression in Eq.(11.6) subject to flip_3\\n//---ie  flip3:( 1<-->5, 2<-->6, 3<-->4, za<-->zb)\\nstatic std::complex<double> Brackpma(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                     FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n//---statement functions\\n  auto delta = [&](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return s(i1,i2) - s(i3,i4) - s(i5,i6);\\n  };\\n  auto zab2 = [&](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n\\n  double IDelta = 1.0/(std::pow(s(j1,j2),2) + std::pow(s(j3,j4),2) + std::pow(s(j5,j6),2)\\n    -2.0*(s(j1,j2)*s(j3,j4) + s(j1,j2)*s(j5,j6) + s(j5,j6)*s(j3,j4)));\\n\\n  std::complex<double> Brackpma_res =\\n      2.0*zb(j1,j2)*za(j2,j3)*zb(j3,j6)\\n     /zb(j5,j6)/std::pow(zab2(j3,j1,j2,j4),2)\\n     *(zab2(j3,j1,j2,j6)*zab2(j2,j1,j3,j4)/zab2(j3,j1,j2,j4)\\n     *L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)\\n     -za(j2,j3)*zb(j3,j6)\\n     *(L0(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)\\n     -1.0/2.0*L1(-t(j1,j2,j3),-s(j1,j2))/s(j1,j2)))\\n     -(3.0*delta(j5,j6,j3,j4,j1,j2)*zab2(j2,j3,j4,j1)\\n     *zab2(j5,j3,j4,j6)*zab2(j4,j1,j2,j3)\\n     /zab2(j3,j1,j2,j4)*std::pow(IDelta,2)\\n     +2.0*za(j3,j2)*zb(j2,j1)*zb(j4,j6)*(t(j1,j2,j3)-t(j1,j2,j4))\\n     *(za(j2,j5)*t(j1,j2,j3)+za(j2,j1)*zb(j1,j6)*za(j6,j5))\\n     /std::pow(zab2(j3,j1,j2,j4),3)*IDelta\\n     -(2.0*za(j2,j3)*zb(j3,j6)*(t(j1,j2,j3)-t(j1,j2,j4))\\n     +delta(j1,j2,j3,j4,j5,j6)\\n     *(za(j2,j5)*t(j1,j2,j3)\\n     +za(j2,j1)*zb(j1,j6)*za(j6,j5))/za(j5,j6))\\n     *za(j5,j2)*zb(j2,j1)/std::pow(zab2(j3,j1,j2,j4),2)*IDelta\\n     +0.5*(za(j1,j2)*std::pow(zb(j1,j6),2)/zb(j5,j6)\\n     +zb(j1,j2)*std::pow(za(j2,j5),2)/za(j5,j6)\\n     -2.0*za(j2,j5)*zb(j1,j6))*zab2(j4,j1,j2,j3)\\n     /zab2(j3,j1,j2,j4)*IDelta)\\n     *(lnrat(-s(j1,j2),-s(j3,j4)));\\n\\n  return Brackpma_res;\\n}\\n\\n//---This is the whole expression in Eq.(11.6) subject to exchange flip_2\\n//---ie  flip2:( 1<-->2, 3<-->4, 5<-->6, za<-->zb)\\nstatic std::complex<double> Brackpm(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n//---statement functions\\n  auto delta = [&](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return s(i1,i2) - s(i3,i4) - s(i5,i6);\\n  };\\n  auto zab2 = [&](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n\\n  double IDelta = 1.0/(std::pow(s(j1,j2),2) + std::pow(s(j3,j4),2) + std::pow(s(j5,j6),2)\\n    -2.0*(+s(j1,j2)*s(j3,j4) + s(j1,j2)*s(j5,j6) + s(j5,j6)*s(j3,j4)));\\n\\n  std::complex<double> Brackpm_res =\\n      -2.0*za(j2,j3)*zb(j4,j6)*zab2(j3,j1,j2,j6)\\n     *zab2(j2,j5,j6,j4)*t(j1,j2,j3)\\n     /za(j1,j2)/zb(j5,j6)/std::pow(zab2(j3,j1,j2,j4),4)\\n     *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\\n     +(2.0*za(j2,j3)*zb(j4,j6)\\n     *(zb(j1,j2)*za(j5,j6)*za(j2,j3)*zb(j4,j6)\\n     -zab2(j5,j2,j4,j1)*zab2(j3,j1,j2,j4))*zab2(j4,j1,j2,j3)\\n     *(t(j1,j2,j3)-t(j1,j2,j4))/std::pow(zab2(j3,j1,j2,j4),3)*IDelta\\n     -3.0*(s(j3,j4)*delta(j3,j4,j1,j2,j5,j6)*zab2(j2,j3,j4,j1)\\n     *zab2(j5,j3,j4,j6)*IDelta\\n     -za(j2,j3)*zb(j3,j1)*za(j5,j4)*zb(j4,j6)\\n     -za(j2,j4)*zb(j4,j1)*za(j5,j3)*zb(j3,j6))\\n     *zab2(j4,j1,j2,j3)/zab2(j3,j1,j2,j4)*IDelta\\n     -zb(j1,j4)*za(j3,j5)*za(j2,j3)*zb(j4,j6)\\n     *std::pow(zab2(j4,j1,j2,j3),2)/std::pow(zab2(j3,j1,j2,j4),2)*IDelta\\n     -zb(j1,j3)*za(j4,j5)*za(j2,j4)*zb(j3,j6)*IDelta)\\n     *i3m(s(j1,j2),s(j3,j4),s(j5,j6))\\n     +(2.0*za(j2,j3)*zb(j4,j6)*t(j1,j2,j3)*zab2(j2,j1,j4,j6)\\n     /za(j1,j2)/zb(j5,j6)/std::pow(zab2(j3,j1,j2,j4),3)\\n     -(std::pow(zab2(j2,j1,j4,j6),2)\\n     +2.0*za(j2,j3)*zb(j3,j6)*za(j2,j4)*zb(j4,j6))\\n     /za(j1,j2)/zb(j5,j6)/std::pow(zab2(j3,j1,j2,j4),2))\\n     *lnrat(-t(j1,j2,j3),-s(j3,j4))\\n//---ie  flip3:( 1<-->5, 2<-->6, 3<-->4, za<-->zb)\\n     +Brackpma(j1,j2,j3,j4,j5,j6,za,zb)\\n     +Brackpma(j5,j6,j4,j3,j1,j2,zb,za)\\n     +zb(j1,j6)*zab2(j4,j1,j2,j3)\\n     *(zb(j1,j6)*delta(j3,j4,j5,j6,j1,j2)\\n     -2.0*zb(j1,j2)*za(j2,j5)*zb(j5,j6))\\n     /zb(j1,j2)/zb(j5,j6)/zab2(j3,j1,j2,j4)*IDelta\\n     +(std::pow(zab2(j2,j1,j4,j6),2)+za(j2,j1)*zb(j1,j6)*za(j2,j5)*zb(j5,j6))\\n     /za(j1,j2)/zb(j5,j6)/std::pow(zab2(j3,j1,j2,j4),2);\\n\\n  return Brackpm_res;\\n}\\n\\n//--- This function returns the result of BDK\\n//--- Published in Nucl.Phys.B513:3-86,1998.\\n//--- e-Print: hep-ph/9708239\\n//--- Eqs.(11.1) and Eqs.(11.6) as appropriate dependent on choice of \\\"st\\\"\\nstd::complex<double> Fvs(int st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                         FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n  std::complex<double> Fvs_res(0.0, 0.0);\\n\\n//---statement functions\\n//---This is the square bracket in Eq.(11.1) subject to exchange 16,25\\n  auto Brackppa = [&](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return za(i1,i2)*std::pow(za(i5,i3)*zb(i3,i1),2)/za(i5,i6)/std::pow(za(i3,i4),2)\\n      *L1(-t(i1,i2,i3),-s(i1,i2))/std::pow(s(i1,i2),2)\\n      +za(i5,i2)*za(i5,i3)*zb(i3,i1)/za(i5,i6)/std::pow(za(i3,i4),2)\\n      *L0(-t(i1,i2,i3),-s(i1,i2))/s(i1,i2);\\n  };\\n\\n//---This is the whole expression in Eq.(11.1) subject to exchange 34\\n  auto Brackpp = [&](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return -za(i2,i3)*za(i2,i4)*za(i3,i5)*za(i4,i5)\\n      /za(i1,i2)/za(i5,i6)/std::pow(za(i3,i4),4)\\n      *Lsm1_2me(t(i1,i2,i3),t(i1,i2,i4),s(i1,i2),s(i5,i6))\\n      -(za(i2,i4)*za(i3,i5)+za(i2,i3)*za(i4,i5))\\n      /za(i1,i2)/za(i5,i6)/std::pow(za(i3,i4),3)\\n      *(za(i5,i3)*zb(i3,i1)*za(i1,i2)\\n      *L0(-t(i1,i2,i3),-s(i1,i2))/s(i1,i2)\\n      +za(i5,i6)*zb(i6,i4)*za(i4,i2)\\n      *L0(-t(i1,i2,i3),-s(i5,i6))/s(i5,i6)\\n      +0.5*za(i5,i2)*(lnrat(-t(i1,i2,i3),-t(i1,i2,i4))))\\n      -Brackppa(i1,i2,i3,i4,i5,i6)-Brackppa(i6,i5,i3,i4,i2,i1)\\n      +0.5/std::pow(za(i3,i4),2)\\n      *(std::pow(za(i2,i5),2)/za(i1,i2)/za(i5,i6)\\n      -std::pow(zb(i1,i6),2)/zb(i1,i2)/zb(i5,i6));\\n  };\\n//---end statement functions\\n\\n  if (st == hqpqbmgpgm) {\\n//---flip2:( 1<-->2, 3<-->4, 5<-->6, za<-->zb)\\n    Fvs_res =\\n      +Brackpm(j1,j2,j3,j4,j5,j6,za,zb)\\n      +Brackpm(j2,j1,j4,j3,j6,j5,zb,za);   // @coverage-probe\\n\\n  } else if (st == hqpqbmgpgp) {\\n\\n//---exch34:(3<-->4)\\n    Fvs_res =\\n      +Brackpp(j1,j2,j3,j4,j5,j6)\\n      +Brackpp(j1,j2,j4,j3,j5,j6);\\n\\n  }\\n\\n  return Fvs_res;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  std::complex<double> Fvs_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                   std::complex<double>* za_ptr, std::complex<double>* zb_ptr) {\\n\\n    FArray2D<std::complex<double>> za(za_ptr, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(zb_ptr, mxpart, mxpart);\\n\\n    return Fvs(st, j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n\\n}\\n\"}"
