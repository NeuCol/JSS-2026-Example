args = "{\"path\": \"software/mcfm/src/BDK/FFMPcc.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <FFMPcc.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <Need.hpp>\\n#include <W1jet.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\nstatic std::complex<double> FFMPcc1(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n//     Statement functions\\n  auto zab2 = [&](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n//     End statement functions\\n\\n  std::complex<double> FFMPcc1_res =\\n      +2.0*za(j2,j3)*zb(j2,j4)*zab2(j5,j2,j3,j4)*zab2(j5,j3,j4,j2)\\n     /(zb(j2,j3)*za(j5,j6)*t(j2,j3,j4)*zab2(j1,j3,j4,j2));\\n\\n  return FFMPcc1_res;\\n}\\n\\nstatic std::complex<double> FFMPcc2(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                    FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n//     Statement functions\\n  auto zab2 = [&](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n//     End statement functions\\n\\n  std::complex<double> FFMPcc2_res =\\n      -2.0*zb(j1,j4)*zb(j2,j4)*za(j1,j5)*zab2(j5,j2,j3,j4)\\n     /(zb(j2,j3)*zb(j3,j4)*za(j5,j6)*zab2(j1,j3,j4,j2));\\n\\n  return FFMPcc2_res;\\n}\\n\\n//     Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\\n//     Eq10.10\\nstatic std::complex<double> FFMPcc_unsym(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                         FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n//     Statement functions\\n  auto zab2 = [&](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n  auto zba2 = [&](int i1, int i2, int i3, int i4) {\\n    return zb(i1,i2)*za(i2,i4) + zb(i1,i3)*za(i3,i4);\\n  };\\n  auto zab = [&](int i1, int i2, int i3) {\\n    return za(i1,i2)*zb(i2,i3);\\n  };\\n  auto za22a = [&](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return zab2(i1,i2,i3,i4)*za(i4,i6)\\n          +zab2(i1,i2,i3,i5)*za(i5,i6);\\n  };\\n  auto zb21b = [&](int i1, int i2, int i3, int i4, int i5) {\\n    return zba2(i1,i2,i3,i4)*zb(i4,i5);\\n  };\\n  auto za21a = [&](int i1, int i2, int i3, int i4, int i5) {\\n    return zab2(i1,i2,i3,i4)*za(i4,i5);\\n  };\\n//     End statement functions\\n  double delta12 = s(j1,j2) - s(j3,j4) - s(j5,j6);\\n\\n  std::complex<double> FFMPcc_unsym_res = std::pow(zab2(j5,j2,j3,j1),2)\\n     /(zb(j2,j3)*za(j5,j6)*zab2(j4,j1,j2,j3)*zab2(j4,j2,j3,j1))\\n     *(Lsm1_2mht(s(j1,j4),t(j1,j2,j3),s(j2,j3),s(j5,j6))\\n     +Lsm1(-s(j1,j2),-t(j1,j2,j3),-s(j2,j3),-t(j1,j2,j3)))\\n\\n     +(std::pow(zb(j2,j4),3)*std::pow(za(j1,j5),2)*t(j2,j3,j4)\\n     /(zb(j2,j3)*zb(j3,j4)*za(j5,j6)*std::pow(zab2(j1,j3,j4,j2),3))\\n     -zb(j2,j4)*std::pow(zab2(j1,j2,j3,j4)*zab2(j5,j3,j4,j2),2)\\n     /(zb(j2,j3)*zb(j3,j4)*za(j5,j6)*t(j2,j3,j4)*std::pow(zab2(j1,j3,j4,j2),3))\\n\\n     -std::pow(za(j2,j3)*zb(j1,j6),2)*zab2(j3,j2,j4,j1)\\n     /(za(j3,j4)*zb(j5,j6)*t(j2,j3,j4)\\n     *zab2(j2,j3,j4,j1)*zab2(j4,j2,j3,j1)))\\n     *Lsm1_2mh(s(j1,j2),t(j2,j3,j4),s(j3,j4),s(j5,j6))\\n\\n     +(std::pow(zb(j1,j3)*za(j4,j5)*t(j1,j2,j3),2)\\n     /(zb(j2,j3)*za(j5,j6)*std::pow(zab2(j4,j1,j2,j3),3)*zab2(j4,j2,j3,j1))\\n     -zab2(j4,j2,j3,j1)*std::pow(zab2(j5,j1,j2,j3),2)\\n     /(zb(j2,j3)*za(j5,j6)*std::pow(zab2(j4,j1,j2,j3),3)))\\n     *Lsm1_2mh(s(j3,j4),t(j1,j2,j3),s(j1,j2),s(j5,j6))\\n\\n     -std::pow(za(j2,j3)*zb(j1,j6),2)\\n     /(zb(j5,j6)*t(j2,j3,j4)*za(j2,j4)*zab2(j4,j2,j3,j1))\\n     *Lsm1(-s(j2,j3),-t(j2,j3,j4),-s(j3,j4),-t(j2,j3,j4))\\n\\n     -0.5*zb(j1,j4)*(std::pow(za22a(j2,j1,j4,j2,j3,j5),2)\\n     -std::pow(za(j2,j5),2)*s(j1,j4)*s(j2,j3))\\n     /(za(j1,j4)*zb(j2,j3)*za(j5,j6)\\n     *zab2(j2,j1,j4,j3)*zab2(j2,j3,j4,j1))\\n     *i3m(s(j1,j4),s(j2,j3),s(j5,j6))\\n\\n     +(0.5*zb(j2,j4)*std::pow(zab2(j5,j2,j3,j4),2)\\n     *(2.0*s(j3,j4)*s(j5,j6)+delta12*t(j2,j3,j4))\\n     /(zb(j2,j3)*zb(j3,j4)*za(j5,j6)*std::pow(t(j2,j3,j4),2)*zab2(j1,j3,j4,j2))\\n\\n     +za(j2,j3)*zb(j1,j6)*zab2(j3,j2,j4,j1)*zab2(j5,j2,j3,j4)\\n     /(std::pow(t(j2,j3,j4),2)*zab2(j4,j2,j3,j1))\\n\\n     +0.5*za(j2,j3)*zb(j1,j6)*zab2(j3,j1,j4,j6)*zab2(j3,j2,j4,j1)\\n     /(za(j3,j4)*zb(j5,j6)*t(j2,j3,j4)*zab2(j4,j2,j3,j1))\\n     +0.5*zb(j1,j4)*za(j2,j5)*zb(j1,j6)*zab(j3,j2,j4)\\n     /(zb(j3,j4)*t(j2,j3,j4)*zab2(j4,j2,j3,j1))\\n     +2.0*za(j2,j3)*std::pow(zb(j2,j4),2)*zab(j5,j1,j6)\\n     /(zb(j2,j3)*t(j2,j3,j4)*zab2(j1,j3,j4,j2))\\n\\n     -zab(j3,j2,j1)*zab2(j5,j2,j3,j1)*zb(j4,j6)\\n     /(zb(j2,j3)*t(j1,j2,j3)*zab2(j4,j2,j3,j1))\\n\\n     +0.5/(zab2(j1,j3,j4,j2)*zab2(j4,j2,j3,j1))\\n\\n     *(zb(j1,j4)*zab(j3,j1,j6)*zab(j5,j2,j4)/zb(j3,j4)\\n     +zb(j1,j4)*zab(j5,j4,j2)*zab2(j5,j2,j3,j4)*delta12\\n     /(zb(j2,j3)*zb(j3,j4)*za(j5,j6))\\n\\n     -za(j2,j3)*zb(j1,j6)/(za(j3,j4)*zb(j5,j6))\\n     *(zab(j3,j2,j6)*zab2(j3,j1,j4,j2)+zab(j3,j1,j2)*zab(j3,j5,j6))\\n\\n     +2.0*zb(j1,j2)*zab(j3,j5,j6)*zab2(j5,j2,j3,j4)/zb(j2,j3)\\n\\n     +zb(j2,j4)*zb(j1,j6)/(zb(j2,j3)*zb(j3,j4))\\n     *(zab(j5,j2,j4)*(s(j5,j6)-t(j1,j2,j3))\\n     +zab(j5,j3,j4)*(s(j5,j6)+t(j2,j3,j4)))\\n\\n     +zb(j1,j4)*za(j3,j5)*(2.0*zab(j3,j4,j6)+zab(j3,j2,j6)))\\n\\n     +0.5/(zab2(j1,j3,j4,j2)*zab2(j4,j1,j2,j3)*zab2(j4,j2,j3,j1))\\n     *(za(j4,j1)*zb(j1,j2)*za(j2,j3)*zb(j3,j4)/zb(j2,j3)\\n     *((zab(j5,j1,j2)-zab(j5,j4,j2))*zb(j1,j6)\\n     -2.0*zb(j1,j2)*zab(j5,j4,j6))\\n\\n     +zb21b(j1,j3,j4,j2,j4)\\n     *(za(j3,j5)*zab(j4,j1,j6)+za(j4,j5)*zab(j3,j2,j6))\\n     +zab(j5,j3,j6)*(zab(j3,j2,j1)*s(j1,j3)+zab(j3,j4,j1)*s(j1,j2))\\n\\n     +zb(j1,j3)*(zab(j3,j1,j6)-zab(j3,j2,j6))*za21a(j3,j1,j2,j4,j5)\\n     +zab2(j5,j3,j4,j1)*zab(j3,j4,j6)*s(j2,j3)\\n     +zab(j5,j4,j1)*zab2(j3,j1,j2,j6)*s(j1,j3)\\n\\n     +(3.0*zab(j3,j2,j1)+zab(j3,j4,j1))*zab(j5,j2,j6)*s(j1,j4)\\n     -zab(j5,j3,j1)*zab2(j1,j3,j4,j6)*(zab(j3,j2,j1)-zab(j3,j4,j1))\\n\\n     +2.0*zab(j3,j4,j1)*zb(j1,j6)\\n     *(za(j5,j1)*(s(j1,j2)+t(j1,j2,j3))-zab(j5,j2,j3)*za(j3,j1))\\n     -zab(j3,j2,j1)*zab(j5,j4,j6)*s(j3,j4)\\n\\n     +4.0*za(j5,j1)*zb(j1,j2)*za(j2,j3)*zb(j3,j1)*zab(j3,j4,j6)\\n\\n     -za(j2,j3)*zab2(j4,j2,j3,j1)\\n     *(2.0*(zab(j5,j2,j4)-zab(j5,j3,j4))*zb(j2,j6)\\n     -zab(j5,j1,j6)*zb(j2,j4))))\\n     *i3m(s(j1,j2), s(j3,j4), s(j5,j6))\\n\\n     +FFMPcc1(j1,j2,j3,j4,j5,j6,za,zb)\\n     *L0(-t(j2,j3,j4),-s(j3,j4))/s(j3,j4)\\n     +FFMPcc2(j1,j2,j3,j4,j5,j6,za,zb)\\n     *L0(-t(j2,j3,j4),-s(j5,j6))/s(j5,j6);\\n\\n  return FFMPcc_unsym_res;\\n}\\n\\n//     Z. Bern, L. Dixon, D.A. Kosower, e-Print:hep-ph/9708239\\n//     Eq10.10\\nstd::complex<double> FFMPcc(int j1, int j2, int j3, int j4, int j5, int j6,\\n                            FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n  std::complex<double> FFMPcc_res = FFMPcc_unsym(j1,j2,j3,j4,j5,j6,za,zb)\\n                                   +FFMPcc_unsym(j2,j1,j4,j3,j6,j5,zb,za);   // @coverage-probe\\n\\n  return FFMPcc_res;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  std::complex<double> FFMPcc_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                      std::complex<double>* za_ptr, std::complex<double>* zb_ptr) {\\n\\n    FArray2D<std::complex<double>> za(za_ptr, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(zb_ptr, mxpart, mxpart);\\n\\n    return FFMPcc(j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n\\n}\\n\"}"
