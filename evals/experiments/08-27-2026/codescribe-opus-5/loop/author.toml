   }\\n    if ((lbl == \\\"1x34pp\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = ipp;\\n      ltag = 3;\\n      itag = c1_34;\\n    }\\n    if ((lbl == \\\"12x34\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = imp;\\n      ltag = 3;\\n      itag = c12_34;\\n    }\\n    if ((lbl == \\\"12x34pp\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = ipp;\\n      ltag = 3;\\n      itag = c12_34;\\n    }\\n    if ((lbl == \\\"1x34x2mp\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = imp;\\n      ltag = 4;\\n      itag = d1_34_2;\\n    }\\n    if ((lbl == \\\"1x34x2pp\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = ipp;\\n      ltag = 4;\\n      itag = d1_34_2;\\n    }\\n    if ((lbl == \\\"2x1x34pp\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = ipp;\\n      ltag = 4;\\n      itag = d2_1_34;\\n    }\\n    if ((lbl == \\\"2x1x34\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = imp;\\n      ltag = 4;\\n      itag = d2_1_34;\\n    }\\n    if ((lbl == \\\"d62x1x34\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = imp;\\n      ltag = 4;\\n      itag = d6_2_1_34;\\n    }\\n    if ((lbl.size() >= 6) && (lbl.compare(0,5,\\\"bubmp\\\") == 0) && (h34 == 1) && (h56 == 1)) {\\n      htag = imp;\\n      ltag = 2;\\n      itag = lbl[5]-'0';\\n    }\\n    if ((lbl.size() >= 6) && (lbl.compare(0,5,\\\"bubpp\\\") == 0) && (h34 == 1) && (h56 == 1)) {\\n      htag = ipp;\\n      ltag = 2;\\n      itag = lbl[5]-'0';\\n    }\\n  }\\n\\n//--- Permute 1 and 2:  2 1 3 4 5 6\\n  if (   (j1 == 2) && (j2 == 1) && (j3 == 3)\\n      && (j4 == 4) && (j5 == 5) && (j6 == 6) ) {\\n    if ((lbl == \\\"1x34\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = imp;\\n      ltag = 3;\\n      itag = c2_34;\\n      if (amp0 != czip) amp0 = std::conj(amp0);\\n      if (amp2 != czip) amp2 = std::conj(amp2);\\n      if (amp4 != czip) amp4 = std::conj(amp4);\\n    }\\n    if ((lbl == \\\"1x34pp\\\") && (h34 == 1) && (h56 == 1)) {\\n      htag = ipp;\\n      ltag = 3;\\n      itag = c2_34;\\n      if (