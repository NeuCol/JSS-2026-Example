args = "{\"path\": \"software/mcfm/src/W2jet/ZZbox1LL.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <W2jet.hpp>\\n#include <complex>\\n#include <cmath>\\n#include <FArray.hpp>\\n#include <constants_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\n//-----Author: R.K. Ellis (September 2013)\\n//-----Box coefficient for LL coupling\\n//-----Box D0(p1,p34,p2,mt,mt,mt,mt)\\n//-----Opposite off-shellnesses: so called easy box\\n//-----Xpp and Xmp refer to the initial state gluon polarizations\\nstatic void ZZbox1LLcore(int j1, int j2, int j3, int j4, int j5, int j6,\\n                         FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb, double mt,\\n                         FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n                         FArray4D<std::complex<double>>& Xrat);\\n\\nvoid ZZbox1LL(int j1, int j2, int j3, int j4, int j5, int j6,\\n              FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb, double mt,\\n              FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n              FArray2D<std::complex<double>>& Xpm, FArray2D<std::complex<double>>& Xmm,\\n              FArray4D<std::complex<double>>& Xrat) {\\n  int h3, h5;\\n\\n  ZZbox1LLcore(j1, j2, j3, j4, j5, j6, zb, za, mt, Xpp, Xmp, Xrat);\\n  for (h3 = 1; h3 <= 2; h3++) {\\n    for (h5 = 1; h5 <= 2; h5++) {\\n      Xpm(h3,h5) = Xmp(3-h3,3-h5);   // @coverage-probe\\n      Xmm(h3,h5) = Xpp(3-h3,3-h5);\\n      Xrat(2,1,h3,h5) = Xrat(1,2,3-h3,3-h5);\\n      Xrat(1,1,h3,h5) = Xrat(2,2,3-h3,3-h5);\\n    }\\n  }\\n\\n  ZZbox1LLcore(j1, j2, j3, j4, j5, j6, za, zb, mt, Xpp, Xmp, Xrat);\\n\\n  return;\\n}\\n\\n//-----Author: R.K. Ellis (September 2013)\\n//-----Box coefficient for LL coupling\\n//-----Box D0(p1,p34,p2,mt,mt,mt,mt)\\n//-----Opposite off-shellnesses: so called easy box\\n//-----Xpp and Xmp refer to the initial state gluon polarizations\\nstatic void ZZbox1LLcore(int j1, int j2, int j3, int j4, int j5, int j6,\\n                         FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb, double mt,\\n                         FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n                         FArray4D<std::complex<double>>& Xrat) {\\n  double mtsq, s134, s234;\\n  int k1, k2, k3 = 0, k4 = 0, k5 = 0, k6 = 0, h3, h5;\\n  std::complex<double> app0, app2, app4, amp2, amp4;\\n\\n//--- statement functions\\n  auto zab2 = [&za, &zb](int k1, int k2, int k3, int k4) {\\n    return za(k1,k2)*zb(k2,k4) + za(k1,k3)*zb(k3,k4);\\n  };\\n  auto funcpp2 = [&za, &zb, &zab2](int k1, int k2, int k3, int k4, int k5, int k6) {\\n    return -half*(\\n      +za(k1,k3)*za(k2,k5)*za(k3,k4)*zb(k4,k2)*zb(k4,k3)*zb(k6,k1)\\n      +za(k1,k3)*za(k1,k5)*za(k2,k3)*zb(k2,k1)*zb(k4,k3)*zb(k6,k1)\\n      -za(k1,k2)*za(k3,k4)*za(k3,k5)*zb(k4,k2)*zb(k4,k3)*zb(k6,k1)\\n      -za(k1,k5)*za(k2,k3)*zab2(k5,k3,k4,k2)*zb(k4,k1)*zb(k6,k5)\\n      -4.0*std::pow(za(k1,k5)*za(k2,k3),2)*zb(k2,k1)*zb(k4,k3)*zb(k6,k5)\\n      /za(k1,k2)\\n      -za(k1,k3)*za(k2,k5)*za(k3,k5)*zb(k2,k1)*zb(k4,k3)*zb(k6,k5)\\n      +za(k1,k2)*std::pow(za(k3,k5),2)*zb(k2,k1)*zb(k4,k3)*zb(k6,k5))\\n      /(std::pow(za(k1,k2),2)*s(k3,k4)*s(k5,k6));\\n  };\\n  auto funcmp2 = [&za, &zb, &zab2](int k1, int k2, int k3, int k4, int k5, int k6) {\\n    return half*(-\\n      za(k5,k6)*zab2(k1,k3,k4,k2)*zab2(k3,k2,k4,k1)\\n      *zb(k4,k1)*std::pow(zb(k6,k2),2)/(zab2(k2,k3,k4,k1)*std::pow(zb(k2,k1),2))\\n      +std::pow(za(k1,k5),2)*za(k2,k3)\\n      *zab2(k1,k3,k4,k2)*zab2(k2,k1,k3,k4)*zb(k6,k5)\\n      /(std::pow(za(k1,k2),2)*zab2(k2,k3,k4,k1)))/(s(k3,k4)*s(k5,k6));\\n  };\\n//--- end statement function\\n\\n  mtsq = std::pow(mt, 2);\\n\\n  k1 = j1;\\n  k2 = j2;\\n  for (h3 = 1; h3 <= 2; h3++) {\\n    if (h3 == 1) {\\n      k3 = j3;\\n      k4 = j4;\\n    } else if (h3 == 2) {\\n      k3 = j4;\\n      k4 = j3;\\n    }\\n    for (h5 = 1; h5 <= 2; h5++) {\\n      if (h5 == 1) {\\n        k5 = j5;\\n        k6 = j6;\\n      } else if (h5 == 2) {\\n        k5 = j6;\\n        k6 = j5;\\n      }\\n      s134 = s(k1,k3) + s(k1,k4) + s(k3,k4);\\n      s234 = s(k2,k3) + s(k2,k4) + s(k3,k4);\\n\\n//----Helicity 1^+ 2^+\\n      app0 = half*(two*za(k3,k2)*za(k3,k1)*za(k2,k5)*za(k1,k5)\\n                   +std::pow(za(k3,k5)*za(k1,k2),2))*(s134*s234-s(k3,k4)*s(k5,k6))\\n        /(std::pow(za(k1,k2),4)*za(k3,k4)*za(k5,k6));\\n      app2 = funcpp2(k1,k2,k3,k4,k5,k6) + funcpp2(k2,k1,k3,k4,k5,k6);\\n\\n      app4 = two/(s(k3,k4)*s(k5,k6)*std::pow(za(k1,k2),2))\\n        *(zb(k4,k1)*zab2(k1,k3,k4,k2)*za(k2,k5)\\n          -zb(k4,k2)*zab2(k2,k3,k4,k1)*za(k1,k5))\\n        *(za(k1,k3)*zb(k6,k2)/zab2(k1,k3,k4,k2)\\n          -za(k2,k3)*zb(k6,k1)/zab2(k2,k3,k4,k1));\\n\\n      Xpp(h3,h5) = app0 + mtsq*app2 + std::pow(mtsq,2)*app4;\\n//--- contribution to rational part (coefficient of mt^4)\\n      Xrat(2,2,h3,h5) = app4;\\n\\n//----Helicity 1^- 2^+\\n      amp2 = funcmp2(k1,k2,k3,k4,k5,k6) + funcmp2(k1,k2,k5,k6,k3,k4);\\n\\n      amp4 = two/(s(j1,j2)*s(k3,k4)*s(k5,k6)*std::pow(zab2(k2,k3,k4,k1),2))\\n        *(za(k2,k5)*zb(k1,k4)*zab2(k1,k3,k4,k2)\\n          -za(k1,k5)*zb(k2,k4)*zab2(k2,k3,k4,k1))\\n        *(za(k2,k3)*zb(k1,k6)*zab2(k1,k3,k4,k2)\\n          -za(k1,k3)*zb(k2,k6)*zab2(k2,k3,k4,k1));\\n\\n      Xmp(h3,h5) = mtsq*amp2 + std::pow(mtsq,2)*amp4;\\n//--- contribution to rational part (coefficient of mt^4)\\n      Xrat(1,2,h3,h5) = amp4;\\n    }\\n  }\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n  void ZZbox1LL_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\\n                        std::complex<double>* fza, std::complex<double>* fzb, double mt,\\n                        std::complex<double>* fXpp, std::complex<double>* fXmp,\\n                        std::complex<double>* fXpm, std::complex<double>* fXmm,\\n                        std::complex<double>* fXrat) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    FArray2D<std::complex<double>> Xpp(fXpp, 2, 2);\\n    FArray2D<std::complex<double>> Xmp(fXmp, 2, 2);\\n    FArray2D<std::complex<double>> Xpm(fXpm, 2, 2);\\n    FArray2D<std::complex<double>> Xmm(fXmm, 2, 2);\\n    FArray4D<std::complex<double>> Xrat(fXrat, 2, 2, 2, 2);\\n    ZZbox1LL(j1, j2, j3, j4, j5, j6, za, zb, mt, Xpp, Xmp, Xpm, Xmm, Xrat);\\n  }\\n}\\n\"}"
