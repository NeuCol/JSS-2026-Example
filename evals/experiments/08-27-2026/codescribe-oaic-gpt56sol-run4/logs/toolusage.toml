args = "{\"path\": \"software/mcfm/src/W2jet/ggZZcapture.cpp\", \"content\": \"#include \\\"ggZZcapture.hpp\\\"\\n\\n#include <ZZclabels_mod.hpp>\\n#include <ZZdlabels_mod.hpp>\\n#include <constants_mod.hpp>\\n#include <first_mod.hpp>\\n#include <ggZZ_mod.hpp>\\n\\n#include <algorithm>\\n#include <cmath>\\n\\nusing namespace ZZclabels_mod;\\nusing namespace ZZdlabels_mod;\\nusing constants_mod::czip;\\nusing first_mod::first;\\nusing ggZZ_mod::res;\\n\\nvoid ggZZcapture(const std::string& raw_label, int h34, int h56,\\n                 int j1, int j2, int j3, int j4, int j5, int j6,\\n                 std::complex<double>& amp0, std::complex<double>& amp2,\\n                 std::complex<double>& amp4) {\\n  constexpr int imt0=1, imt2=2, imt4=3, ipp=1, imp=2;\\n  std::string label=raw_label;\\n  while (!label.empty() && label.back() == ' ') label.pop_back();\\n  if (first) { res.fill(czip); first=false; }\\n  int htag=-1, ltag=0, itag=0;\\n  const bool helicities=h34==1 && h56==1;\\n  auto set=[&](const std::string& text,int h,int l,int i) {\\n    if (label==text && helicities) { htag=h; ltag=l; itag=i; }\\n  };\\n  auto conjugate=[&]() {\\n    if (amp0 != czip) amp0=std::conj(amp0);\\n    if (amp2 != czip) amp2=std::conj(amp2);\\n    if (amp4 != czip) amp4=std::conj(amp4);\\n  };\\n\\n  if (j1==1 && j2==2 && j3==3 && j4==4 && j5==5 && j6==6) {\\n    set(\\\"1x2\\\",imp,3,c1_2); set(\\\"1x2pp\\\",ipp,3,c1_2);\\n    set(\\\"1x34\\\",imp,3,c1_34); set(\\\"1x34pp\\\",ipp,3,c1_34);\\n    set(\\\"12x34\\\",imp,3,c12_34); set(\\\"12x34pp\\\",ipp,3,c12_34);\\n    set(\\\"1x34x2mp\\\",imp,4,d1_34_2); set(\\\"1x34x2pp\\\",ipp,4,d1_34_2);\\n    set(\\\"2x1x34pp\\\",ipp,4,d2_1_34); set(\\\"2x1x34\\\",imp,4,d2_1_34);\\n    set(\\\"d62x1x34\\\",imp,4,d6_2_1_34);\\n    if (helicities && label.size() >= 6 && label.compare(0,5,\\\"bubmp\\\")==0) {\\n      htag=imp; ltag=2; itag=label[5]-'0';\\n    }\\n    if (helicities && label.size() >= 6 && label.compare(0,5,\\\"bubpp\\\")==0) {\\n      htag=ipp; ltag=2; itag=label[5]-'0';\\n    }\\n  }\\n  if (j1==2 && j2==1 && j3==3 && j4==4 && j5==5 && j6==6) {\\n    if (label==\\\"1x34\\\" && helicities) { htag=imp; ltag=3; itag=c2_34; conjugate(); }\\n    if (label==\\\"1x34pp\\\" && helicities) { htag=ipp; ltag=3; itag=c2_34; conjugate(); }\\n    if (label==\\\"2x1x34\\\" && helicities) { htag=imp; ltag=4; itag=d1_2_34; conjugate(); }\\n    if (label==\\\"d62x1x34\\\" && helicities) { htag=imp; ltag=4; itag=d6_1_2_34; conjugate(); }\\n  }\\n  if (j1==1 && j2==2 && j3==5 && j4==6 && j5==3 && j6==4) {\\n    set(\\\"1x34\\\",imp,3,c1_56); set(\\\"1x34pp\\\",ipp,3,c1_56);\\n    set(\\\"2x1x34pp\\\",ipp,4,d1_2_34);\\n  }\\n  if (j1==2 && j2==1 && j3==5 && j4==6 && j5==3 && j6==4) {\\n    if (label==\\\"1x34\\\" && helicities) { htag=imp; ltag=3; itag=c2_56; conjugate(); }\\n    if (label==\\\"1x34pp\\\" && helicities) { htag=ipp; ltag=3; itag=c2_56; conjugate(); }\\n  }\\n  if (htag < 0) return;\\n  res(htag,ltag,itag,imt0)=amp0;\\n  res(htag,ltag,itag,imt2)=amp2;\\n  res(htag,ltag,itag,imt4)=amp4;  // @coverage-probe\\n  if (std::abs(res(htag,ltag,itag,imt0)) < 1e-8) res(htag,ltag,itag,imt0)=czip;\\n  if (std::abs(res(htag,ltag,itag,imt2)) < 1e-8) res(htag,ltag,itag,imt2)=czip;\\n  if (std::abs(res(htag,ltag,itag,imt4)) < 1e-8) res(htag,ltag,itag,imt4)=czip;\\n}\\n\\nextern \\\"C\\\" void ggZZcapture_wrapper(\\n    const char* label, const int* label_len, const int* h34, const int* h56,\\n    const int* j1, const int* j2, const int* j3, const int* j4,\\n    const int* j5, const int* j6, std::complex<double>* amp0,\\n    std::complex<double>* amp2, std::complex<double>* amp4) {\\n  ggZZcapture(std::string(label,*label_len),*h34,*h56,*j1,*j2,*j3,*j4,*j5,*j6,\\n              *amp0,*amp2,*amp4);\\n}\\n\"}"
