-s(j5,j6),-t(j2,j3,j4))*za(j1,j5)*zb(j1,j2)/zb(j2,j3)/t(j2,j3,j4));\\n\\n  t0 = s2-(Lsm1(-s(j3,j4),-t(j2,j3,j4),-s(j2,j3),-t(j2,j3,j4))+Lsm1_2mht(s(j1,j2),t(j2,j3,j4),s(j3,j4),s(j5,j6)))\\n       *(1.0/za(j5,j6)/zb(j2,j3)*std::pow(za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4),2)/(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))/t(j2,j3,j4)\\n        -1.0/za(j2,j3)*std::pow(za(j3,j4),2)/(za(j2,j4)*zb(j1,j2)+za(j3,j4)*zb(j1,j3))*std::pow(zb(j1,j6),2)/zb(j5,j6)/t(j2,j3,j4))\\n       +1.0/za(j5,j6)/zb(j2,j3)/(za(j1,j2)*zb(j2,j4)+za(j1,j3)*zb(j3,j4))\\n       *(L1(-s(j5,j6),-t(j2,j3,j4))*std::pow(za(j1,j5),2)*std::pow(zb(j1,j2),2)\\n        +L1(-t(j2,j3,j4),-s(j2,j3))/std::pow(s(j2,j3),2)*std::pow(za(j3,j4),2)*std::pow(zb(j2,j3),2)*std::pow(-za(j2,j5)*zb(j2,j4)-za(j3,j5)*zb(j3,j4),2))/t(j2,j3,j4)/2.0;\\n\\n  fpp_res = t0;   // @coverage-probe\\n\\n  return fpp_res;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  std::complex<double> fpp_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\\n                                   std::complex<double>* fza, std::complex<double>* fzb) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    return fpp(j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n\\n}\\n\"}"
