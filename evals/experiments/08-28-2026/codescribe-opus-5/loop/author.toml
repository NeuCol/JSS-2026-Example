args = "{\"path\": \"software/mcfm/src/W2jet/LRcalc.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <LRcalc.hpp>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\nvoid LRcalc(int k1, int k2, int k3, int k4, int k5, int k6,\\n            FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n            FArray1D<std::complex<double>>& A,\\n            FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n            FArray2D<std::complex<double>>& Xpm, FArray2D<std::complex<double>>& Xmm) {\\n\\n  int l3 = 0, l4 = 0, l5 = 0, l6 = 0;\\n  double s12, s34, s56;\\n\\n//---statementfunctions\\n  auto zab2 = [&](int m1, int m2, int m3, int m4) {\\n    return za(m1,m2)*zb(m2,m4) + za(m1,m3)*zb(m3,m4);\\n  };\\n  auto zba2 = [&](int m1, int m2, int m3, int m4) {\\n    return zb(m1,m2)*za(m2,m4) + zb(m1,m3)*za(m3,m4);\\n  };\\n//---end statement functions\\n\\n  s12 = s(k1,k2);\\n  s34 = s(k3,k4);\\n  s56 = s(k5,k6);\\n  for (int h3 = 1; h3 <= 2; h3++) {\\n    if (h3 == 1) {\\n      l3 = k3;\\n      l4 = k4;\\n    } else if (h3 == 2) {\\n      l3 = k4;\\n      l4 = k3;\\n    }\\n    for (int h5 = 1; h5 <= 2; h5++) {\\n      if (h5 == 1) {\\n        l5 = k5;\\n        l6 = k6;\\n      } else if (h5 == 2) {\\n        l5 = k6;\\n        l6 = k5;\\n      }\\n\\n      Xmp(h3,h5) = (A(2)*s12*za(l3,l5)*zb(l4,l6)*zab2(k1,k3,k4,k2)/zab2(k2,k3,k4,k1) - (A(3)+A(4))*za(k1,l3)*za(k1,l5)*zb(k2,l4)*zb(k2,l6) + A(5)*zab2(k1,k3,k4,k2)*(za(l3,l5)*zb(k2,l4)*zb(l6,k2)/zb(k1,k2) + za(k1,l3)*za(k1,l5)*zb(l4,l6)/za(k1,k2)))/s34/s56/s12;   // @coverage-probe\\n\\n      Xpp(h3,h5) = za(l3,l5)/(za(k1,k2)*s12*s34*s56)*(\\n        +(A(3)+A(1))*s12*zb(k1,l6)*zb(l4,k2)\\n        -(A(4)+A(1))*s12*zb(k2,l6)*zb(l4,k1)\\n        +A(5)*(zb(k2,l4)*zb(k2,l6)*zab2(k2,k3,k4,k1)\\n               -zb(k1,l4)*zb(k1,l6)*zab2(k1,k3,k4,k2)));\\n\\n//--- these are obtained by c.c. of above\\n      Xpm(3-h3,3-h5) = (\\n         A(2)*s12*zb(l3,l5)*za(l4,l6)*zba2(k1,k3,k4,k2)/zba2(k2,k3,k4,k1)\\n        -(A(3)+A(4))*zb(k1,l3)*zb(k1,l5)*za(k2,l4)*za(k2,l6)\\n        +A(5)*zba2(k1,k3,k4,k2)\\n        *(zb(l3,l5)*za(k2,l4)*za(l6,k2)/za(k1,k2)\\n          +zb(k1,l3)*zb(k1,l5)*za(l4,l6)/zb(k1,k2)))/s34/s56/s12;\\n\\n      Xmm(3-h3,3-h5) = zb(l3,l5)/(zb(k1,k2)*s12*s34*s56)*(\\n        +(A(3)+A(1))*s12*za(k1,l6)*za(l4,k2)\\n        -(A(4)+A(1))*s12*za(k2,l6)*za(l4,k1)\\n        +A(5)*(za(k2,l4)*za(k2,l6)*zba2(k2,k3,k4,k1)\\n               -za(k1,l4)*za(k1,l6)*zba2(k1,k3,k4,k2)));\\n\\n    }\\n  }\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  void LRcalc_wrapper(int k1, int k2, int k3, int k4, int k5, int k6,\\n                      std::complex<double>* fza, std::complex<double>* fzb,\\n                      std::complex<double>* fA,\\n                      std::complex<double>* fXpp, std::complex<double>* fXmp,\\n                      std::complex<double>* fXpm, std::complex<double>* fXmm) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    FArray1D<std::complex<double>> A(fA, 6);\\n    FArray2D<std::complex<double>> Xpp(fXpp, 2, 2);\\n    FArray2D<std::complex<double>> Xmp(fXmp, 2, 2);\\n    FArray2D<std::complex<double>> Xpm(fXpm, 2, 2);\\n    FArray2D<std::complex<double>> Xmm(fXmm, 2, 2);\\n    LRcalc(k1, k2, k3, k4, k5, k6, za, zb, A, Xpp, Xmp, Xpm, Xmm);\\n  }\\n\\n}\\n\"}"
