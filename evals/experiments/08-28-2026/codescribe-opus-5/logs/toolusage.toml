int k6, double mt,\\n                     std::complex<double>* fA) {\\n\\n    FArray1D<std::complex<double>> A(fA, 6);\\n    Acalc(k1, k2, k3, k4, k5, k6, mt, A);\\n  }\\n\\n}\\n\"}"
