args = "{\"path\": \"software/mcfm/src/W2jet/ZZbox1LL.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <ZZbox1LL.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <FArray.hpp>\\n#include <constants_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\n\\n//-----Author: R.K. Ellis (September 2013)\\n//-----Box coefficient for LL coupling\\n//-----Box D0(p1,p34,p2,mt,mt,mt,mt)\\n//-----Opposite off-shellnesses: so called easy box\\n//-----Xpp and Xmp refer to the initial state gluon polarizations\\n// ZZbox1LLcore is only called from ZZbox1LL, so it stays local to this unit.\\nstatic void ZZbox1LLcore(int j1, int j2, int j3, int j4, int j5, int j6,\\n                         FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb, double mt,\\n                         FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n                         FArray4D<std::complex<double>>& Xrat) {\\n\\n  double mtsq, s134, s234;\\n  int k1, k2, k3 = 0, k4 = 0, k5 = 0, k6 = 0, h3, h5;\\n  std::complex<double> app0, app2, app4, amp2, amp4;\\n\\n//--- statement functions\\n  auto zab2 = [&](int i1, int i2, int i3, int i4) {\\n    return za(i1,i2)*zb(i2,i4) + za(i1,i3)*zb(i3,i4);\\n  };\\n  auto funcpp2 = [&](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return -half*(\\n      + za(i1,i3)*za(i2,i5)*za(i3,i4)*zb(i4,i2)*zb(i4,i3)*zb(i6,i1)\\n      + za(i1,i3)*za(i1,i5)*za(i2,i3)*zb(i2,i1)*zb(i4,i3)*zb(i6,i1)\\n      - za(i1,i2)*za(i3,i4)*za(i3,i5)*zb(i4,i2)*zb(i4,i3)*zb(i6,i1)\\n      - za(i1,i5)*za(i2,i3)*zab2(i5,i3,i4,i2)*zb(i4,i1)*zb(i6,i5)\\n      - 4.0*std::pow(za(i1,i5)*za(i2,i3),2)*zb(i2,i1)*zb(i4,i3)*zb(i6,i5)\\n        /za(i1,i2)\\n      - za(i1,i3)*za(i2,i5)*za(i3,i5)*zb(i2,i1)*zb(i4,i3)*zb(i6,i5)\\n      + za(i1,i2)*std::pow(za(i3,i5),2)*zb(i2,i1)*zb(i4,i3)*zb(i6,i5))\\n      /(std::pow(za(i1,i2),2)*s(i3,i4)*s(i5,i6));\\n  };\\n  auto funcmp2 = [&](int i1, int i2, int i3, int i4, int i5, int i6) {\\n    return half*(-\\n      za(i5,i6)*zab2(i1,i3,i4,i2)*zab2(i3,i2,i4,i1)\\n      *zb(i4,i1)*std::pow(zb(i6,i2),2)/(zab2(i2,i3,i4,i1)*std::pow(zb(i2,i1),2))\\n      + std::pow(za(i1,i5),2)*za(i2,i3)\\n      *zab2(i1,i3,i4,i2)*zab2(i2,i1,i3,i4)*zb(i6,i5)\\n      /(std::pow(za(i1,i2),2)*zab2(i2,i3,i4,i1)))/(s(i3,i4)*s(i5,i6));\\n  };\\n//--- end statement function\\n\\n  mtsq = std::pow(mt,2);\\n\\n  k1 = j1;\\n  k2 = j2;\\n  for (h3 = 1; h3 <= 2; h3++) {\\n    if (h3 == 1) {\\n      k3 = j3;\\n      k4 = j4;\\n    } else if (h3 == 2) {\\n      k3 = j4;\\n      k4 = j3;\\n    }\\n    for (h5 = 1; h5 <= 2; h5++) {\\n      if (h5 == 1) {\\n        k5 = j5;\\n        k6 = j6;\\n      } else if (h5 == 2) {\\n        k5 = j6;\\n        k6 = j5;\\n      }\\n      s134 = s(k1,k3) + s(k1,k4) + s(k3,k4);\\n      s234 = s(k2,k3) + s(k2,k4) + s(k3,k4);\\n\\n//----Helicity 1^+ 2^+\\n      app0 = half*(two*za(k3,k2)*za(k3,k1)*za(k2,k5)*za(k1,k5)\\n           + std::pow(za(k3,k5)*za(k1,k2),2))*(s134*s234 - s(k3,k4)*s(k5,k6))\\n           /(std::pow(za(k1,k2),4)*za(k3,k4)*za(k5,k6));\\n      app2 = funcpp2(k1,k2,k3,k4,k5,k6) + funcpp2(k2,k1,k3,k4,k5,k6);\\n\\n      app4 = two/(s(k3,k4)*s(k5,k6)*std::pow(za(k1,k2),2))\\n           *(zb(k4,k1)*zab2(k1,k3,k4,k2)*za(k2,k5)\\n            -zb(k4,k2)*zab2(k2,k3,k4,k1)*za(k1,k5))\\n           *(za(k1,k3)*zb(k6,k2)/zab2(k1,k3,k4,k2)\\n            -za(k2,k3)*zb(k6,k1)/zab2(k2,k3,k4,k1));\\n\\n      Xpp(h3,h5) = app0 + mtsq*app2 + std::pow(mtsq,2)*app4;   // @coverage-probe\\n//--- contribution to rational part (coefficient of mt^4)\\n      Xrat(2,2,h3,h5) = app4;\\n\\n//----Helicity 1^- 2^+\\n      amp2 = funcmp2(k1,k2,k3,k4,k5,k6) + funcmp2(k1,k2,k5,k6,k3,k4);\\n\\n      amp4 = two/(s(j1,j2)*s(k3,k4)*s(k5,k6)*std::pow(zab2(k2,k3,k4,k1),2))\\n           *(za(k2,k5)*zb(k1,k4)*zab2(k1,k3,k4,k2)\\n            -za(k1,k5)*zb(k2,k4)*zab2(k2,k3,k4,k1))\\n           *(za(k2,k3)*zb(k1,k6)*zab2(k1,k3,k4,k2)\\n            -za(k1,k3)*zb(k2,k6)*zab2(k2,k3,k4,k1));\\n\\n      Xmp(h3,h5) = mtsq*amp2 + std::pow(mtsq,2)*amp4;\\n//--- contribution to rational part (coefficient of mt^4)\\n      Xrat(1,2,h3,h5) = amp4;\\n\\n    }\\n  }\\n\\n  return;\\n}\\n\\n//-----Author: R.K. Ellis (September 2013)\\n//-----Box coefficient for LL coupling\\n//-----Box D0(p1,p34,p2,mt,mt,mt,mt)\\n//-----Opposite off-shellnesses: so called easy box\\n//-----Xpp and Xmp refer to the initial state gluon polarizations\\nvoid ZZbox1LL(int j1, int j2, int j3, int j4, int j5, int j6,\\n              FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb, double mt,\\n              FArray2D<std::complex<double>>& Xpp, FArray2D<std::complex<double>>& Xmp,\\n              FArray2D<std::complex<double>>& Xpm, FArray2D<std::complex<double>>& Xmm,\\n              FArray4D<std::complex<double>>& Xrat) {\\n\\n  int h3, h5;\\n\\n  ZZbox1LLcore(j1,j2,j3,j4,j5,j6,zb,za,mt,Xpp,Xmp,Xrat);\\n  for (h3 = 1; h3 <= 2; h3++) {\\n    for (h5 = 1; h5 <= 2; h5++) {\\n      Xpm(h3,h5) = Xmp(3-h3,3-h5);\\n      Xmm(h3,h5) = Xpp(3-h3,3-h5);\\n      Xrat(2,1,h3,h5) = Xrat(1,2,3-h3,3-h5);\\n      Xrat(1,1,h3,h5) = Xrat(2,2,3-h3,3-h5);\\n    }\\n  }\\n\\n  ZZbox1LLcore(j1,j2,j3,j4,j5,j6,za,zb,mt,Xpp,Xmp,Xrat);\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  void ZZbox1LL_wrapper(int j1, int j2, int j3, int j4, int j5, int j6,\\n                        std::complex<double>* fza, std::complex<double>* fzb, double mt,\\n                        std::complex<double>* fXpp, std::complex<double>* fXmp,\\n                        std::complex<double>* fXpm, std::complex<double>* fXmm,\\n                        std::complex<double>* fXrat) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    FArray2D<std::complex<double>> Xpp(fXpp, 2, 2);\\n    FArray2D<std::complex<double>> Xmp(fXmp, 2, 2);\\n    FArray2D<std::complex<double>> Xpm(fXpm, 2, 2);\\n    FArray2D<std::complex<double>> Xmm(fXmm, 2, 2);\\n    // the FArray4D attach constructor takes the first three extents\\n    FArray4D<std::complex<double>> Xrat(fXrat, 2, 2, 2);\\n    ZZbox1LL(j1,j2,j3,j4,j5,j6,za,zb,mt,Xpp,Xmp,Xpm,Xmm,Xrat);\\n  }\\n\\n}\\n\"}"
