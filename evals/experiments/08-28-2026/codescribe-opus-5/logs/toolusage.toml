args = "{\"path\": \"software/mcfm/src/W2jet/a6treeg.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <a6treeg.hpp>\\n#include <complex>\\n#include <cstdlib>\\n#include <iostream>\\n#include <FArray.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <heldefs_mod.hpp>\\n#include <W1jet.hpp>\\n\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\nusing namespace heldefs_mod;\\n\\n//----hep-ph/9708239, Eqs(8.4,8.8,8.14,9.2,9.7,10.1) Multiplied by (-i)\\nstd::complex<double> a6treeg(int st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                             FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb) {\\n\\n  std::complex<double> a6treeg_res(0.0, 0.0);\\n\\n  if (st == hqpgmgpqbm) {\\n    a6treeg_res =\\n      ((za(j2,j4)*za(j4,j5)*zb(j1,j3)*zb(j1,j6))/\\n       (s(j2,j3)*s(j5,j6)*za(j3,j4)*zb(j1,j2))-\\n       (za(j4,j5)*std::pow(zb(j1,j3),2)*(-(za(j1,j2)*zb(j1,j6))+za(j2,j3)*zb(j3,j6)))/\\n       (s(j2,j3)*s(j5,j6)*zb(j1,j2)*t(j1,j2,j3))+\\n       (std::pow(za(j2,j4),2)*zb(j1,j6)*(-(za(j2,j5)*zb(j2,j3))+za(j4,j5)*zb(j3,j4)))/\\n       (s(j2,j3)*s(j5,j6)*za(j3,j4)*t(j2,j3,j4)));   // @coverage-probe\\n  } else if (st == hqpgpgmqbm) {\\n    a6treeg_res =\\n      (-(((za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4))*\\n          (-(za(j1,j3)*zb(j1,j6))-za(j2,j3)*zb(j2,j6)))/\\n         (s(j2,j3)*s(j5,j6)*za(j1,j2)*zb(j3,j4)))-\\n       (za(j1,j3)*za(j4,j5)*zb(j1,j2)*\\n        (-(za(j1,j3)*zb(j1,j6))-za(j2,j3)*zb(j2,j6)))/\\n       (s(j2,j3)*s(j5,j6)*za(j1,j2)*t(j1,j2,j3))+\\n       (za(j3,j4)*zb(j1,j6)*zb(j2,j4)*\\n        (za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4)))/\\n       (s(j2,j3)*s(j5,j6)*zb(j3,j4)*t(j2,j3,j4)));\\n  } else if (st == hqpgpgpqbm) {\\n//---This amplitude corresponds to\\n//    q(4)+l(5) --> q_R(1)+l_R(6)+g_R(2)+g_R(3)\\n    a6treeg_res =\\n      (-std::pow(za(j4,j5),2))/(za(j1,j2)*za(j2,j3)*za(j3,j4)*za(j5,j6));\\n  } else if (st == hqpgpqbmgm) {\\n    a6treeg_res =\\n      (((za(j3,j5)*zb(j1,j3)+za(j4,j5)*zb(j1,j4))*\\n        (-(za(j1,j3)*zb(j1,j6))-za(j2,j3)*zb(j2,j6)))/\\n       (s(j5,j6)*za(j1,j2)*za(j2,j3)*zb(j1,j4)*zb(j3,j4))+\\n       (za(j3,j5)*zb(j1,j2)*(-(za(j1,j4)*zb(j1,j6))-za(j2,j4)*zb(j2,j6)))\\n       /\\n       (s(j5,j6)*za(j1,j2)*zb(j1,j4)*t(j1,j2,j4))-\\n       (za(j3,j4)*zb(j1,j6)*(za(j3,j5)*zb(j2,j3)+za(j4,j5)*zb(j2,j4)))/\\n       (s(j5,j6)*za(j2,j3)*zb(j3,j4)*t(j2,j3,j4)));\\n  } else if (st == hqpgpqbmgp) {\\n    a6treeg_res =\\n      (-za(j1,j3)*std::pow(za(j3,j5),2))/\\n      (za(j1,j2)*za(j1,j4)*za(j2,j3)*za(j3,j4)*za(j5,j6));\\n  } else if (st == hqpqbmgmgp) {\\n    a6treeg_res =\\n      (((-(za(j2,j5)*zb(j2,j4))-za(j3,j5)*zb(j3,j4))*\\n        (-(za(j1,j3)*zb(j1,j6))+za(j3,j4)*zb(j4,j6)))/\\n       (s(j3,j4)*s(j5,j6)*za(j1,j4)*zb(j2,j3))-\\n       (za(j1,j3)*za(j2,j5)*zb(j1,j4)*\\n        (-(za(j1,j3)*zb(j1,j6))+za(j3,j4)*zb(j4,j6)))/\\n       (s(j3,j4)*s(j5,j6)*za(j1,j4)*t(j1,j3,j4))-\\n       (za(j2,j3)*zb(j1,j6)*zb(j2,j4)*\\n        (-(za(j2,j5)*zb(j2,j4))-za(j3,j5)*zb(j3,j4)))/\\n       (s(j3,j4)*s(j5,j6)*zb(j2,j3)*t(j2,j3,j4)));\\n  } else if (st == hqpqbmgpgm) {\\n    a6treeg_res =\\n      -(-((za(j2,j4)*za(j2,j5)*zb(j1,j3)*zb(j1,j6))/\\n          (s(j3,j4)*s(j5,j6)*za(j2,j3)*zb(j1,j4)))+\\n        (za(j2,j5)*std::pow(zb(j1,j3),2)*(-(za(j1,j4)*zb(j1,j6))-za(j3,j4)*zb(j3,j6)))/\\n        (s(j3,j4)*s(j5,j6)*zb(j1,j4)*t(j1,j3,j4))+\\n        (std::pow(za(j2,j4),2)*zb(j1,j6)*(-(za(j2,j5)*zb(j2,j3))+za(j4,j5)*zb(j3,j4)))/\\n        (s(j3,j4)*s(j5,j6)*za(j2,j3)*t(j2,j3,j4)));\\n  } else if (st == hqpqbmgpgp) {\\n    a6treeg_res =\\n      (-std::pow(za(j2,j5),2))/(za(j1,j4)*za(j2,j3)*za(j3,j4)*za(j5,j6));\\n  } else {\\n    std::cout << \\\" unimplemented st \\\" << st << std::endl;\\n    std::exit(1);\\n  }\\n\\n  return a6treeg_res;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  std::complex<double> a6treeg_wrapper(int st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                                       std::complex<double>* fza, std::complex<double>* fzb) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    return a6treeg(st, j1, j2, j3, j4, j5, j6, za, zb);\\n  }\\n\\n}\\n\"}"
