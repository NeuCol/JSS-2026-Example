args = "{\"path\": \"dev/tmp/gen_pp_mod.py\", \"content\": \"\\\"\\\"\\\"Generate the C++ translation unit for the pp-style Fortran data modules.\\n\\nReads the Fortran module (pp_mod.f90 / ppwp2j_mod.f90), extracts the integer\\nlist inside the reshape((/ ... /), (/9,9,9,9/)) initializer and writes the\\nmatching <base>.hpp / <base>.cpp pair.  The C++ storage keeps the Fortran\\nelement order (column major, flat), so the Fortran mirror module can map the\\nsame memory back onto pp(-4:4,-4:4,-4:4,-4:4).\\n\\\"\\\"\\\"\\nimport re\\nimport sys\\n\\n\\ndef extract_values(path):\\n    text = open(path).read()\\n    start = text.index(\\\"reshape((/\\\")\\n    end = text.index(\\\"/)\\\", start + len(\\\"reshape((/\\\"))\\n    body = text[start + len(\\\"reshape((/\\\"):end]\\n    body = body.replace(\\\"&\\\", \\\" \\\").replace(\\\"\\\\n\\\", \\\" \\\")\\n    values = [v.strip() for v in body.split(\\\",\\\") if v.strip()]\\n    shape_part = text[end:]\\n    shape = re.search(r\\\"\\\\(/\\\\s*(\\\\d+)\\\\s*,\\\\s*(\\\\d+)\\\\s*,\\\\s*(\\\\d+)\\\\s*,\\\\s*(\\\\d+)\\\\s*/\\\\)\\\", shape_part)\\n    dims = tuple(int(g) for g in shape.groups())\\n    return values, dims\\n\\n\\ndef emit(base, path_f90, out_dir):\\n    values, dims = extract_values(path_f90)\\n    total = dims[0] * dims[1] * dims[2] * dims[3]\\n    assert len(values) == total, (len(values), total)\\n    guard = base.upper()\\n\\n    hpp = []\\n    hpp.append(\\\"#ifndef %s\\\" % guard)\\n    hpp.append(\\\"#define %s\\\" % guard)\\n    hpp.append(\\\"\\\")\\n    hpp.append(\\\"#include<ppmax_mod.hpp>\\\")\\n    hpp.append(\\\"\\\")\\n    hpp.append(\\\"namespace %s {\\\" % base)\\n    hpp.append(\\\"  using namespace ppmax_mod;\\\")\\n    hpp.append(\\\"\\\")\\n    hpp.append(\\\"  // pp(-4:4,-4:4,-4:4,-4:4) held in Fortran (column major) order.\\\")\\n    hpp.append(\\\"  const int pp_lbound = -4;\\\")\\n    hpp.append(\\\"  const int pp_extent = %d;\\\" % dims[0])\\n    hpp.append(\\\"  const int pp_size = %d;\\\" % total)\\n    hpp.append(\\\"\\\")\\n    hpp.append(\\\"  extern int pp[pp_size];\\\")\\n    hpp.append(\\\"\\\")\\n    hpp.append(\\\"  inline int& pp_at(int i, int j, int k, int l) {\\\")\\n    hpp.append(\\\"    return pp[(i - pp_lbound)\\\")\\n    hpp.append(\\\"              + pp_extent * ((j - pp_lbound)\\\")\\n    hpp.append(\\\"              + pp_extent * ((k - pp_lbound)\\\")\\n    hpp.append(\\\"              + pp_extent * (l - pp_lbound)))];\\\")\\n    hpp.append(\\\"  }\\\")\\n    hpp.append(\\\"}\\\")\\n    hpp.append(\\\"\\\")\\n    hpp.append(\\\"extern \\\\\\\"C\\\\\\\" {\\\")\\n    hpp.append(\\\"  int* %s_pp();\\\" % base)\\n    hpp.append(\\\"}\\\")\\n    hpp.append(\\\"\\\")\\n    hpp.append(\\\"#endif\\\")\\n    hpp.append(\\\"\\\")\\n\\n    cpp = []\\n    cpp.append(\\\"/*\\\")\\n    cpp.append(\\\" */\\\")\\n    cpp.append(\\\"\\\")\\n    cpp.append(\\\"#include<%s.hpp>\\\" % base)\\n    cpp.append(\\\"\\\")\\n    cpp.append(\\\"namespace %s {\\\" % base)\\n    cpp.append(\\\"  int pp[pp_size] = {\\\")\\n    per_line = 27\\n    for start in range(0, total, per_line):\\n        chunk = values[start:start + per_line]\\n        line = \\\"    \\\" + \\\", \\\".join(\\\"%2s\\\" % v for v in chunk)\\n        if start + per_line < total:\\n            line += \\\",\\\"\\n        cpp.append(line)\\n    cpp.append(\\\"  };\\\")\\n    cpp.append(\\\"}\\\")\\n    cpp.append(\\\"\\\")\\n    cpp.append(\\\"extern \\\\\\\"C\\\\\\\" {\\\")\\n    cpp.append(\\\"  int* %s_pp() {\\\" % base)\\n    cpp.append(\\\"    return %s::pp;\\\" % base)\\n    cpp.append(\\\"  }\\\")\\n    cpp.append(\\\"}\\\")\\n    cpp.append(\\\"\\\")\\n\\n    open(\\\"%s/%s.hpp\\\" % (out_dir, base), \\\"w\\\").write(\\\"\\\\n\\\".join(hpp))\\n    open(\\\"%s/%s.cpp\\\" % (out_dir, base), \\\"w\\\").write(\\\"\\\\n\\\".join(cpp))\\n    print(\\\"wrote %s.hpp and %s.cpp (%d values, dims %s)\\\" % (base, base, total, dims))\\n\\n\\nif __name__ == \\\"__main__\\\":\\n    out