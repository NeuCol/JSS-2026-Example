args = "{\"path\": \"software/mcfm/src/W2jet/a6routine.cpp\", \"content\": \"//\\n//  SPDX-License-Identifier: GPL-3.0-or-later\\n//  Copyright (C) 2019-2022, respective authors of MCFM.\\n//\\n#include <a6routine.hpp>\\n#include <atree.hpp>\\n#include <cmath>\\n#include <complex>\\n#include <cstdlib>\\n#include <iostream>\\n#include <FArray.hpp>\\n#include <constants_mod.hpp>\\n#include <nf_mod.hpp>\\n#include <mxpart_mod.hpp>\\n#include <sprods_com_mod.hpp>\\n#include <scale_mod.hpp>\\n#include <masses_mod.hpp>\\n#include <epinv_mod.hpp>\\n#include <toploops_mod.hpp>\\n#include <Need.hpp>\\n\\nusing namespace constants_mod;\\nusing namespace nf_mod;\\nusing namespace mxpart_mod;\\nusing namespace sprods_com_mod;\\nusing namespace scale_mod;\\nusing namespace masses_mod;\\nusing namespace epinv_mod;\\nusing namespace toploops_mod;\\n\\nextern \\\"C\\\" {\\n  // A6texact is still a Fortran function\\n  std::complex<double> a6texact_(double* s23, double* mt2);\\n}\\n\\n//***********************************************************************\\n//     Author: R.K. Ellis                                               *\\n//     July, 1998.                                                      *\\n//***********************************************************************\\n//     a6sf is the sum of a6s and a6f\\n//     it is only the sum which is needed.\\nvoid a6routine(const char* st, int j1, int j2, int j3, int j4, int j5, int j6,\\n               FArray2D<std::complex<double>>& za, FArray2D<std::complex<double>>& zb,\\n               std::complex<double>& a6sf, std::complex<double>& a6tp, std::complex<double>& a6uv) {\\n\\n  std::complex<double> virtsf, virtuv, virttp, tree;\\n\\n  if (st[0] == 's' && st[1] == 'l') {\\n    std::cout << \\\" error in a6routine \\\" << st[0] << st[1] << std::endl;\\n    std::exit(1);\\n  }\\n  tree = atree(st, j1, j2, j3, j4, j5, j6, za, zb);\\n\\n  virttp = czip;\\n\\n  if (toplight) {\\n    if (toploops == tapprox) {\\n      if (mt != 0.0) {\\n        virttp = -2.0/15.0*s(j2,j3)/std::pow(mt,2);\\n      } else {\\n        std::cout << \\\"mt=0 in a6routine\\\" << std::endl;\\n        std::exit(1);\\n      }\\n    } else if (toploops == texact) {\\n      double s23 = s(j2,j3);\\n      double mt2 = std::pow(mt,2);\\n      virttp = a6texact_(&s23, &mt2);\\n    } else if (toploops == tnone) {\\n      virttp = czip;\\n    }\\n  } else {\\n    virttp = czip;\\n  }\\n\\n  virtsf = two/three*epinv\\n         + two/three*lnrat(musq,-s(j2,j3)) + 10.0/9.0;\\n  virtuv = (epinv*(11.0 - two/xn*static_cast<double>(nf)) - one)/three;\\n//---virtuv is the infinite and finite renormalization\\n//---to get us to MS bar system\\n  a6sf = tree*virtsf;\\n  a6tp = tree*virttp;\\n  a6uv = tree*virtuv;   // @coverage-probe\\n\\n  return;\\n}\\n\\nextern \\\"C\\\" {\\n\\n  void a6routine_wrapper(const char* st, int j1, int j2, int j3, int j4, int j5, int j6,\\n                         std::complex<double>* fza, std::complex<double>* fzb,\\n                         std::complex<double>& a6sf, std::complex<double>& a6tp, std::complex<double>& a6uv) {\\n\\n    FArray2D<std::complex<double>> za(fza, mxpart, mxpart);\\n    FArray2D<std::complex<double>> zb(fzb, mxpart, mxpart);\\n    a6routine(st, j1, j2, j3, j4, j5, j6, za, zb, a6sf, a6tp, a6uv);\\n  }\\n\\n}\\n\"}"
